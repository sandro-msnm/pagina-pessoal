<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Primeira Página Web</title>
</head>
<body>

    <h1>Boas-vindas à minha página!</h1>
    <p>Este é um parágrafo de boas-vindas para a atividade de Programação web.</p>
    <p><strong>Desenvolvido por:</strong> Sandro Moretti Simão do Nascimento Mendes</p>
    <section id="contato">
        <h2>Entre em contato</h2>
        <form action="#" method="POST">
            <fieldset>
                <legend>Formulário de Contato</legend>
                
                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </p>
                
                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                
                <p>
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto">
                </p>
                
                <p>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea>
                </p>
                
                <div class="botoes">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>
            </fieldset>
        </form>
    </section>

</body>
</html>
